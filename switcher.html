<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TabCtrl</title>
  <link rel="stylesheet" href="content.css">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .tabctrl-switcher {
      position: relative;
      display: grid;
      align-content: safe center;
      justify-content: safe center;
      box-shadow: none;
      border-radius: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
    }
  </style>
</head>
<body>
  <div id="switcher" class="tabctrl-switcher"></div>
  <script src="shared.js"></script>
  <script src="switcher.js"></script>
</body>
</html>
